# cargo mutants configuration (https://mutants.rs). Scope: the protocol core.
examine_globs = [
  "src/frame_io.rs",
  "src/slave.rs",
  "src/slave_server.rs",
  "src/master.rs",
  "src/describe.rs",
]

# Survivors analysed in docs/superpowers/verification/2026-11-05-e2e-pymodbus.md. Each one is
# excluded for a stated reason; any other survivor fails the mutation job.
exclude_re = [
  # Equivalent: for address <= 65535 and quantity <= 2000, address * quantity > 65536 exactly
  # when address + quantity > 65536 is reachable only with both >= 2, where both reject.
  'replace \+ with \* in check_limits',
  # Equivalent: on a broadcast read rmodbus reports processing_required = false, and
  # process_write on a read frame returns an error that changes no storage.
  'replace && with \|\| in UnitStore::handle_broadcast',
  # Only differ on real accept()/recv() errors (e.g. EMFILE), not reproducible deterministically.
  'replace match guard e\.kind\(\) == io::ErrorKind::WouldBlock with true in accept_loop',
  'replace match guard crate::frame_io::is_timeout\(&e\) with true in udp_loop',
  # Caught, but they take the runner down: each fails four frame_io unit tests at once, while the
  # slave's read loop in the same test binary spins on the frames it is handed at once and grows
  # until memory runs out (measured 2026-11-06: from 14 GB to under 2 GB available in about
  # 30 s). On the CI runner that killed the job with "received a shutdown signal" before any
  # result, in every run checked (7 to 12).
  'replace FrameReader::next_frame -> Result<Vec<u8>, FrameError> with Ok\(vec!\[',
  # Same runaway: an empty frame leaves the buffer as it is, so next_frame hands the read loop
  # one empty frame after another (measured 2026-11-07: from 14.8 GB to 1.8 GB available in
  # 26 s). Applied by hand it fails 10 of the 11 frame_io unit tests.
  'replace FrameReader::complete_len -> Result<Option<usize>, FrameError> with Ok\(Some\(0\)\)',
]
