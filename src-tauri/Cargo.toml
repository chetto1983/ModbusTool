[package]
name = "modbus-tool"
version = "3.0.0"
description = "Modbus TCP/UDP/RTU/ASCII master and slave tool"
authors = ["ModbusTool contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "modbus_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmodbus = "0.13"
serialport = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
