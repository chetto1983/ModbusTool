# Shared config for the CodeQL matrix in ../workflows/codeql.yml (pattern from Aura).
# paths bound every language extracted without a build, Rust included (measured on
# 2026-11-05: with only `src` listed, CodeQL found no Rust code and the job failed). The scan
# covers the shipped sources, not tests, build configs or the E2E harness.
name: "ModbusTool CodeQL config"

queries:
  - uses: security-and-quality

paths:
  - src
  - src-tauri/src

paths-ignore:
  - "src/**/*.test.ts"
  - "src-tauri/src/**/*_tests.rs"
