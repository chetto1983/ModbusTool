name: Release

# Builds the Windows MSI and the Linux packages, signs the MSI through SignPath when it is
# configured, and publishes a GitHub release whose text is the version's CHANGELOG.md section.
#
# Start it by pushing a tag vX.Y.Z, or from the Actions tab (Run workflow) with the tag to
# create: the release then creates the tag on the commit the workflow ran on.
#
# Signing (docs/signing.md): set the repository variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN.
# Without SIGNPATH_PROJECT_SLUG the MSI is published unsigned. SignPath requires every job of
# this workflow to run on GitHub-hosted runners.
#
# Updates (docs/superpowers/specs/2026-11-06-updater-design.md): the publish job signs every
# package with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and publishes latest.json, which installed apps read.
# It signs after SignPath because Authenticode signing changes the MSI.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v3.0.1 (must match the app version)"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.notes.outputs.body }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The tag matches the app version
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the app version $version (src-tauri/tauri.conf.json)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG section of this version
        id: notes
        run: |
          body=$(awk -v v="${TAG#v}" '
            $0 ~ "^## v?" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: notes
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Reads the cache ci.yml's bundle job saves on master; releases never write it.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: false
      - run: npm ci
      # MSI only: SignPath deep-signs an MSI (the app inside too) but not an NSIS installer
      # (docs/superpowers/specs/2026-11-05-signing-design.md).
      - run: npx tauri build --bundles msi
      - name: One Paraglide runtime in the frontend bundle
        run: node scripts/check-single-runtime.mjs
      - name: Unsigned MSI
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-unsigned
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          # Only passed to the publish job; the release keeps the packages.
          retention-days: 1

  build-linux:
    needs: notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: false
      - name: System dependencies
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - name: One Paraglide runtime in the frontend bundle
        run: node scripts/check-single-runtime.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1

  sign-windows:
    needs: [notes, build-windows]
    if: vars.SIGNPATH_PROJECT_SLUG != ''
    runs-on: ubuntu-24.04
    # The request waits for a person to approve it in SignPath; a hosted job lasts at most 6 h.
    timeout-minutes: 355
    steps:
      # The artifact configuration in SignPath is .signpath/artifact-configuration.xml. Every
      # signing request waits for a manual approval in SignPath (SignPath Foundation terms).
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed
          # The artifact configuration enforces this as the PE ProductVersion.
          parameters: |
            version: "${{ needs.notes.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-signed
          path: signed/*.msi
          if-no-files-found: error
          # Only passed to the publish job; the release keeps the packages.
          retention-days: 1

  publish:
    needs: [notes, build-windows, build-linux, sign-windows]
    # sign-windows is skipped while SignPath is not configured; a failed signing stops the release.
    if: >-
      always() && needs.notes.result == 'success' && needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sign-windows.result)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The Tauri CLI pinned by package-lock.json signs the packages for the updater.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Signed MSI
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed
          path: assets
      - name: Unsigned MSI (SignPath not configured)
        if: needs.sign-windows.result == 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: assets
      - name: Updater signatures and latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOTES: ${{ needs.notes.outputs.body }}
          VERSION: ${{ needs.notes.outputs.version }}
        # Without the key installed apps could not verify this release: stop instead of publishing
        # a release they silently never see.
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set (docs/signing.md, Updates)" >&2
            exit 1
          fi
          printf '%s\n' "$NOTES" > notes.md
          packages=(assets/*.msi assets/deb/*.deb assets/appimage/*.AppImage)
          for package in "${packages[@]}"; do npx tauri signer sign "$package"; done
          node scripts/updater-manifest.mjs "$VERSION" notes.md \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" "${packages[@]}" > latest.json
          jq -e '.platforms | has("windows-x86_64-msi") and has("linux-x86_64-appimage") and has("linux-x86_64-deb")' latest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -print
          gh release create "$TAG" assets/*.msi assets/*.msi.sig assets/deb/*.deb assets/deb/*.deb.sig \
            assets/appimage/*.AppImage assets/appimage/*.AppImage.sig latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ModbusTool $TAG" --notes-file notes.md

  # Updates the package in the Windows Package Manager (docs/publishing.md). It runs once the first
  # version is in microsoft/winget-pkgs and the WINGET_TOKEN secret (a classic token with
  # public_repo, from the account that forked winget-pkgs) is set; without the secret it skips.
  winget:
    needs: publish
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit the new version to winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${env:TAG}".TrimStart("v")
          $url = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/${env:TAG}/ModbusTool_${version}_x64_en-US.msi"
          # A pinned release of Microsoft's tool, checked against its hash before it runs.
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") { throw "wingetcreate.exe hash $hash" }
          .\wingetcreate.exe update chetto1983.ModbusTool --urls $url --version $version --submit --token $env:WINGET_TOKEN
