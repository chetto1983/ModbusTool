name: Release

# Pushing a tag vX.Y.Z builds the Windows and Linux installers and publishes them as a GitHub
# release, with the matching CHANGELOG.md section as notes (Aura's release flow).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CHANGELOG section of this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v v="$version" '
            $0 ~ "^## v?" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Reads the cache ci.yml's bundle job saves on master; tags never write it.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: false
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ModbusTool ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
