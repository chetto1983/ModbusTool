name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Without a shell key a step runs without pipefail (pattern from Aura's workflows).
defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: System dependencies
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      # One writer per cache, as in Aura: master saves, branches and PRs only read, so a branch
      # push never evicts the entry master's next run needs.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-llvm-cov
      - name: Frontend dist placeholder (required by tauri::generate_context)
        run: mkdir -p dist
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Tests with coverage gate (85% of lines, CLAUDE.md)
        run: cargo llvm-cov --fail-under-lines 85 --summary-only
        working-directory: src-tauri

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Translations complete (messages/, project.inlang)
        run: npm run check:i18n
      - run: npm run format:check
      - run: npm run deadcode
      - run: npm run dup
      - name: Tests with coverage gate (85%, vite.config.ts thresholds)
        run: npm run coverage
      - run: npm run build

  file-size:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/check-file-size.sh

  bundle:
    needs: [rust, frontend, file-size]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same packages release.yml publishes: MSI only on Windows (SignPath deep-signs
          # an MSI, not an NSIS installer).
          - os: windows-latest
            bundles: msi
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Shared with release.yml: a tag builds from master's warm dependency cache.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: bundle
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: One Paraglide runtime in the frontend bundle
        run: node scripts/check-single-runtime.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ModbusTool-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The real app against pymodbus (e2e/run.mjs), on both desktop platforms Tauri can drive.
  # Windows has no socat, so its run has no serial checks and says so in its output.
  e2e:
    needs: [rust, frontend, file-size]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pymodbus==3.16.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
        with:
          extra: webkit2gtk-driver xvfb socat
      - run: cargo install tauri-driver --locked --version 2.1.0
      # tauri-driver drives Edge WebView2 through msedgedriver, whose version must match the
      # WebView2 on the runner (https://v2.tauri.app/develop/tests/webdriver/ci/).
      - name: Edge driver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/run.mjs
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: node e2e/run.mjs
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      # Failure screenshots and what the webview showed, to read a failure without guessing.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ runner.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
