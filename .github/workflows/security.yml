name: Security audit

# Known vulnerabilities in the dependency graphs: RustSec for the crates, the npm advisory
# database for the frontend. Runs on dependency changes and weekly, after CodeQL.
on:
  push:
    paths: ["src-tauri/Cargo.lock", "package-lock.json", ".github/workflows/security.yml"]
  pull_request:
    paths: ["src-tauri/Cargo.lock", "package-lock.json", ".github/workflows/security.yml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      # Only what ships in the app: dev tooling never reaches users.
      - run: npm audit --omit=dev --audit-level=high
